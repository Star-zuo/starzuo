<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下载</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #fff;
      color: #222;
      max-width: 560px;
      margin: 40px auto 0;
      padding: 0 16px;
      line-height: 1.7;
      font-size: 15px;
    }
    h2 { font-size: 17px; margin-bottom: 10px; }
    ul { list-style: disc; padding-left: 24px; margin: 0 0 24px; }
    li { margin: 4px 0; }
    a { color: #06c; }
    .msg { color: #888; }
    .copyright {
      border-top: 1px solid #ddd;
      padding-top: 14px;
      margin-top: 32px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h2>下载列表</h2>
  <ul id="file-list">
    <li class="msg" id="status">正在加载…</li>
  </ul>

  <div class="copyright">
    Copyright (c) 2026 Star-zuo, All rights reserved.<br>
    本站及仓库内容受版权法保护，未经许可不得复制、再分发或用于商业用途。授权请联系 admin@yuny.work<br>
    列表中的软件归各自版权方所有。
  </div>

  <script>
    const REPO_OWNER = 'Star-zuo';
    const REPO_NAME = 'starzuo';
    const DIR = 'software';
    const ZIP_RE = /\.(zip|tar|gz|tgz|7z)$/i;

    function stripExt(name) {
      return name.replace(/\.(zip|tar\.gz|tgz|gz|7z)$/i, '');
    }

    async function loadFiles() {
      const list = document.getElementById('file-list');
      const status = document.getElementById('status');
      try {
        const resp = await fetch(
          `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DIR}`
        );
        if (!resp.ok) throw new Error('API ' + resp.status);
        const files = await resp.json();
        const zips = files.filter(f => f.type === 'file' && ZIP_RE.test(f.name));

        status.remove();
        if (zips.length === 0) {
          list.innerHTML = '<li class="msg">暂无文件</li>';
          return;
        }
        zips.sort((a, b) => a.name.localeCompare(b.name));
        for (const f of zips) {
          const li = document.createElement('li');
          li.textContent = stripExt(f.name);
          list.appendChild(li);
        }
      } catch (e) {
        status.textContent = '加载失败，请刷新重试';
      }
    }

    loadFiles();
  </script>
</body>
</html>
